name: Stream QA
run-name: Stream QA ${{ inputs.run_key }}

on:
  workflow_dispatch:
    inputs:
      run_key:
        description: Run id (set by the QA page)
        required: true
      config:
        description: Test settings as JSON (set by the QA page)
        required: true

permissions:
  contents: write

env:
  QA_CONFIG: ${{ inputs.config }}

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows - Chrome",  os: windows-latest, target: win-chrome }
          - { name: "Windows - Edge",    os: windows-latest, target: win-edge }
          - { name: "Windows - Firefox", os: windows-latest, target: win-firefox }
          - { name: "Mac - Safari",      os: macos-14,       target: mac-safari }
          - { name: "Mac - Chrome",      os: macos-14,       target: mac-chrome }
          - { name: "Mac - Firefox",     os: macos-14,       target: mac-firefox }
          - { name: "Linux - Chrome",    os: ubuntu-latest,  target: linux-chrome }
          - { name: "Linux - Firefox",   os: ubuntu-latest,  target: linux-firefox }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install test tools
        shell: bash
        run: |
          npm install --no-save playwright@1.47.2 selenium-webdriver@4.25.0
          case "${{ matrix.target }}" in
            *firefox) npx playwright install firefox ;;
          esac
          if [ "${{ matrix.target }}" = "linux-firefox" ]; then sudo apt-get update && sudo apt-get install -y ffmpeg libavcodec-extra && npx playwright install-deps firefox; fi
          if [ "${{ matrix.target }}" = "mac-safari" ]; then sudo safaridriver --enable; fi
      - name: Start QA server
        if: runner.os == 'Windows'
        shell: pwsh
        run: Start-Process -FilePath python -ArgumentList "qa_server.py" -WindowStyle Hidden; Start-Sleep 3
      - name: Start QA server
        if: runner.os != 'Windows'
        run: nohup python3 qa_server.py > server.log 2>&1 & sleep 3
      - name: Run test
        run: node run-browsers.mjs one ${{ matrix.target }}
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: "results-${{ matrix.target }}", path: "qa_state.json\nshot-*.png", if-no-files-found: ignore }

  ios:
    name: iPhone simulator - Safari
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Start QA server
        run: nohup python3 qa_server.py > server.log 2>&1 & sleep 3
      - name: Run test in the iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          sleep 20
          xcrun simctl openurl "$UDID" "$(node run-browsers.mjs url ios-safari Simulator)"
          sleep 60; xcrun simctl io "$UDID" screenshot shot-ios-1min.png || true
          node run-browsers.mjs wait ios-safari || true
          xcrun simctl io "$UDID" screenshot shot-ios-end.png || true
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: results-ios, path: "qa_state.json\nshot-*.png\nserver.log", if-no-files-found: ignore }

  android:
    name: Android emulator - Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start QA server
        run: nohup python3 qa_server.py > server.log 2>&1 & sleep 3
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: results-android, path: "qa_state.json\nshot-*.png", if-no-files-found: ignore }

  report:
    name: Combine results
    needs: [desktop, ios, android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: collected }
      - run: python3 merge.py "${{ inputs.run_key }}"
      - name: Save results to the qa-results branch
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          KEY: ${{ inputs.run_key }}
        run: |
          if ! gh api "repos/$R/git/ref/heads/qa-results" >/dev/null 2>&1; then
            SHA=$(gh api "repos/$R/git/ref/heads/${{ github.ref_name }}" --jq .object.sha)
            gh api -X POST "repos/$R/git/refs" -f ref=refs/heads/qa-results -f sha="$SHA"
          fi
          base64 -w0 "results/$KEY.json" > b64.txt
          gh api -X PUT "repos/$R/contents/results/$KEY.json" -f message="Stream QA results $KEY" -f branch=qa-results -F content=@b64.txt
